[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflica-bench"
version = "0.1.0"
description = "M.Tech research benchmark for attribute-aware revision of state graphs. Category 1 floor only in this version."
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "pydantic>=2.6",
]

[project.optional-dependencies]
csp = ["ortools>=9.9"]
llm = ["google-genai==2.29.0"]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["reflica_bench*"]
exclude = ["tests*", "scenarios*"]
