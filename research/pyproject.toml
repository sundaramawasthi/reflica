[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflica-bench"
version = "0.1.0"
description = "M.Tech research benchmark for attribute-aware revision of state graphs. Benchmark v0.2.0: 63 scenarios across 7 categories, deterministic baselines, and the B5 engine."
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "pydantic>=2.6",
]

[project.optional-dependencies]
csp = ["ortools>=9.9"]
llm = ["google-genai==2.29.0"]
dev = ["pytest>=8", "pytest-cov>=5"]
service = ["fastapi>=0.110", "uvicorn>=0.29", "pandas>=2.2", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["."]
include = ["reflica_bench*", "reflica_service*"]
exclude = ["tests*", "scenarios*"]
